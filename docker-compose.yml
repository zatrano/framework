services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_URL: http://localhost:8080
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
      QUEUE_CONNECTION: database
      CACHE_STORE: file
      MAIL_MAILER: log
    volumes:
      - ./storage:/app/storage
      - ./database:/app/database
    command: ["/app/zatrano", "serve", "--port", "8080"]

  # docker compose --profile postgres up
  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zatrano
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zatrano"]
      interval: 5s
      timeout: 5s
      retries: 10

  # docker compose --profile mysql up
  mysql:
    profiles: ["mysql"]
    image: mysql:8
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: zatrano
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # docker compose --profile mssql up
  mssql:
    profiles: ["mssql"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Password123"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

  # docker compose --profile mongo up
  mongo:
    profiles: ["mongo"]
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  mysql_data:
  mssql_data:
  mongo_data:
