name: static analysis

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:

permissions:
  contents: read

jobs:
  vet:
    runs-on: ubuntu-24.04
    name: go vet
    defaults:
      run:
        working-directory: framework

    steps:
      - name: Checkout framework
        uses: actions/checkout@v5
        with:
          path: framework

      - name: Checkout canvas
        uses: actions/checkout@v5
        with:
          repository: zatrano/canvas
          ref: main
          path: canvas

      - name: Checkout rawhttp
        uses: actions/checkout@v5
        with:
          repository: zatrano/rawhttp
          ref: main
          path: rawhttp

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.13'
          cache: true
          cache-dependency-path: framework/go.mod

      - name: Download modules
        run: go mod download

      - name: Run go vet
        run: go vet ./...

  staticcheck:
    runs-on: ubuntu-24.04
    name: staticcheck
    defaults:
      run:
        working-directory: framework

    steps:
      - name: Checkout framework
        uses: actions/checkout@v5
        with:
          path: framework

      - name: Checkout canvas
        uses: actions/checkout@v5
        with:
          repository: zatrano/canvas
          ref: main
          path: canvas

      - name: Checkout rawhttp
        uses: actions/checkout@v5
        with:
          repository: zatrano/rawhttp
          ref: main
          path: rawhttp

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.13'
          cache: true
          cache-dependency-path: framework/go.mod

      - name: Download modules
        run: go mod download

      - name: Install staticcheck
        # Pin: @latest (v0.8+) needs Go >= 1.26; CI runs 1.25.x with GOTOOLCHAIN=local
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0

      - name: Run staticcheck
        run: staticcheck ./...
