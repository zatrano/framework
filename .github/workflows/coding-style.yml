name: coding style

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:

permissions:
  contents: read

jobs:
  gofmt:
    runs-on: ubuntu-24.04
    name: gofmt

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.13'
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

  mod-tidy:
    runs-on: ubuntu-24.04
    name: go mod tidy
    defaults:
      run:
        working-directory: framework

    steps:
      - name: Checkout framework
        uses: actions/checkout@v5
        with:
          path: framework

      - name: Checkout canvas
        uses: actions/checkout@v5
        with:
          repository: zatrano/canvas
          ref: main
          path: canvas

      - name: Checkout rawhttp
        uses: actions/checkout@v5
        with:
          repository: zatrano/rawhttp
          ref: main
          path: rawhttp

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.13'
          cache: true
          cache-dependency-path: framework/go.mod

      - name: Check go.mod and go.sum
        run: |
          if [ ! -f go.sum ]; then
            echo "go.sum must exist now that the module has dependencies"
            exit 1
          fi
          go mod tidy
          git diff --exit-code -- go.mod go.sum
