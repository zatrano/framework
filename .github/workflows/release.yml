name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: framework
    steps:
      - name: Checkout framework
        uses: actions/checkout@v5
        with:
          path: framework

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: framework/go.mod

      - name: VERSION matches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v*) ;;
            *) echo "tag must look like vX.Y.Z" >&2; exit 1 ;;
          esac
          version=$(tr -d '[:space:]' < VERSION)
          want="${TAG#v}"
          if [ "$version" != "$want" ]; then
            echo "VERSION file is ${version}, tag is ${want}" >&2
            exit 1
          fi

      - name: Module has no replace directives
        run: |
          set -euo pipefail
          json=$(go mod edit -json)
          echo "$json" | jq -e '(.Replace // []) | length == 0' >/dev/null

      - name: Select release notes
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/release-notes.md"
          file=".github/RELEASE_NOTES_${TAG}.md"
          if [ -f "$file" ]; then
            cp "$file" "$notes"
          else
            ver="${TAG#v}"
            awk -v ver="$ver" '
              index($0, "## " ver " ") == 1 { capture = 1 }
              capture && /^## / && index($0, "## " ver " ") != 1 { exit }
              capture { print }
            ' CHANGELOG.md > "$notes"
          fi
          if [ ! -s "$notes" ]; then
            echo "no release notes for ${TAG}" >&2
            exit 1
          fi
          echo "path=${notes}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ steps.notes.outputs.path }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release ${TAG} already exists; leaving it unchanged"
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --notes-file "$NOTES"
