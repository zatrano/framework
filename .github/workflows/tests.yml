name: tests

on:
  push:
    branches:
      - main
      - '*.x'
      - 'v2-dev'
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

env:
  APP_KEY: ci-test-app-key-not-for-production-use
  APP_ENV: testing
  APP_DEBUG: 'true'

jobs:
  linux_tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25.13']
    name: Go ${{ matrix.go }}
    defaults:
      run:
        working-directory: framework
    steps:
      - name: Checkout framework
        uses: actions/checkout@v5
        with:
          path: framework

      - name: Checkout packages
        uses: actions/checkout@v5
        with:
          repository: zatrano/packages
          ref: v2-dev
          path: packages

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: framework/go.sum

      - name: Download modules
        run: go mod download

      - name: Unit tests
        run: go test ./...

  windows_tests:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25.13']
    name: Go ${{ matrix.go }} - Windows
    defaults:
      run:
        working-directory: framework
    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout framework
        uses: actions/checkout@v5
        with:
          path: framework

      - name: Checkout packages
        uses: actions/checkout@v5
        with:
          repository: zatrano/packages
          ref: v2-dev
          path: packages

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: framework/go.sum

      - name: Download modules
        run: go mod download

      - name: Execute tests
        run: go test ./...

  starter_smoke:
    name: zatrano new smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout framework
        uses: actions/checkout@v5
        with:
          path: framework

      - name: Checkout packages
        uses: actions/checkout@v5
        with:
          repository: zatrano/packages
          ref: v2-dev
          path: packages

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.13'
          cache: true
          cache-dependency-path: framework/go.sum

      - name: Scaffold app, enable billing, hit health
        working-directory: framework
        env:
          PACKAGES_DIR: ${{ github.workspace }}/packages
        run: bash .github/scripts/starter-smoke.sh
