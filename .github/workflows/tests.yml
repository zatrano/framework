name: tests

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  linux_tests:
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: zatrano
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: zatrano
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d zatrano"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7.0
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    strategy:
      fail-fast: true
      matrix:
        go: ['1.25.13']

    name: Go ${{ matrix.go }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: go run ./cmd/zatrano key:generate

      - name: Download modules
        run: go mod download

      - name: Unit tests (sqlite)
        run: go test ./...
        env:
          APP_ENV: testing
          APP_DEBUG: 'true'
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          CACHE_STORE: file
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: file
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          MONGO_URI: memory

      - name: Link MySQL driver + live smoke
        run: |
          go run ./cmd/zatrano db:setup --drivers=sqlite,mysql --default=mysql --yes
          go test ./packages/database -run TestLiveDriverSmoke -count=1
          go run ./cmd/zatrano db:setup --drivers=sqlite --default=sqlite --yes
        env:
          ZATRANO_LIVE_DB: '1'
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: zatrano
          DB_USERNAME: root
          DB_PASSWORD: ''

      - name: Link PostgreSQL driver + live smoke
        run: |
          go run ./cmd/zatrano db:setup --drivers=sqlite,pgsql --default=pgsql --yes
          go test ./packages/database -run TestLiveDriverSmoke -count=1
          go run ./cmd/zatrano db:setup --drivers=sqlite --default=sqlite --yes
        env:
          ZATRANO_LIVE_DB: '1'
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: zatrano
          DB_USERNAME: postgres
          DB_PASSWORD: secret
          DB_SSLMODE: disable

      - name: Mongo package tests
        working-directory: packages/mongo
        run: go test . -count=1

  windows_tests:
    runs-on: windows-2022

    strategy:
      fail-fast: true
      matrix:
        go: ['1.25.13']

    name: Go ${{ matrix.go }} - Windows

    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Copy environment file
        run: copy .env.example .env

      - name: Generate application key
        run: go run ./cmd/zatrano key:generate

      - name: Download modules
        run: go mod download

      - name: Execute tests
        run: go test ./...
        env:
          APP_ENV: testing
          APP_DEBUG: 'true'
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          CACHE_STORE: file
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: file
          MONGO_URI: memory
