name: security

on:
  push:
    branches: [main, '*.x']
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

env:
  # Boot/package tests refuse an empty APP_KEY. Must be 16, 24, or 32 bytes for AES-GCM.
  APP_KEY: zatrano-ci-test-key-not-prod!!!!

jobs:
  vet:
    name: go-vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: framework
    steps:
      - name: Checkout framework
        uses: actions/checkout@v5
        with:
          path: framework
      - name: Checkout canvas
        uses: actions/checkout@v5
        with:
          repository: zatrano/canvas
          ref: main
          path: canvas
      - name: Checkout rawhttp
        uses: actions/checkout@v5
        with:
          repository: zatrano/rawhttp
          ref: main
          path: rawhttp
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.13'
          cache: true
          cache-dependency-path: framework/go.mod
      - run: go mod download
      - run: go vet ./...

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: framework
    steps:
      - name: Checkout framework
        uses: actions/checkout@v5
        with:
          path: framework
      - name: Checkout canvas
        uses: actions/checkout@v5
        with:
          repository: zatrano/canvas
          ref: main
          path: canvas
      - name: Checkout rawhttp
        uses: actions/checkout@v5
        with:
          repository: zatrano/rawhttp
          ref: main
          path: rawhttp
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.13'
          cache: true
          cache-dependency-path: framework/go.mod
      - run: go mod download
      - name: Read gosec excludes from .github/gosec.json
        id: gosec_cfg
        run: |
          EXCLUDES=$(jq -r '.exclude // [] | join(",")' .github/gosec.json)
          echo "exclude=$EXCLUDES" >> "$GITHUB_OUTPUT"
      - name: Run gosec
        uses: securego/gosec@master
        with:
          args: >
            -no-fail
            -fmt=sarif
            -out=framework/gosec.sarif
            -conf=framework/.github/gosec.json
            -exclude=${{ steps.gosec_cfg.outputs.exclude }}
            -exclude-generated
            ./framework/...
      - name: Upload gosec SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: framework/gosec.sarif
          category: gosec
      - name: gosec gate (fail on findings)
        run: |
          set -euo pipefail
          # go install pulls transitive modules (e.g. cloud.google.com → otelgrpc);
          # proxy.golang.org occasionally returns HTTP/2 INTERNAL_ERROR — retry.
          install_gosec() {
            go install github.com/securego/gosec/v2/cmd/gosec@v2.22.2
          }
          ok=0
          for i in 1 2 3 4 5; do
            if install_gosec; then
              ok=1
              break
            fi
            echo "gosec install failed (attempt $i); retrying..."
            sleep $((i * 8))
          done
          if [ "$ok" -ne 1 ]; then
            echo "gosec install failed after retries"
            exit 1
          fi
          EXCLUDES=$(jq -r '.exclude // [] | join(",")' .github/gosec.json)
          gosec -quiet \
            -conf=.github/gosec.json \
            -exclude="$EXCLUDES" \
            -exclude-generated \
            ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: framework
    steps:
      - name: Checkout framework
        uses: actions/checkout@v5
        with:
          path: framework
      - name: Checkout canvas
        uses: actions/checkout@v5
        with:
          repository: zatrano/canvas
          ref: main
          path: canvas
      - name: Checkout rawhttp
        uses: actions/checkout@v5
        with:
          repository: zatrano/rawhttp
          ref: main
          path: rawhttp
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.13'
          cache: true
          cache-dependency-path: framework/go.mod
      - run: go mod download
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Run govulncheck
        shell: bash
        run: |
          set +e
          govulncheck ./... | tee govulncheck.txt
          code=${PIPESTATUS[0]}
          {
            echo "## govulncheck"
            echo ""
            echo '```'
            cat govulncheck.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

  # semgrep/semgrep-action is deprecated; official image is recommended.
  # Community packs are advisory (many intentional framework patterns); custom rules gate the job.
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout framework
        uses: actions/checkout@v4
        with:
          path: framework
      - name: Semgrep community (report only)
        run: |
          semgrep scan \
            --config=p/golang \
            --config=p/security-audit \
            --metrics=off \
            framework || true
      - name: Semgrep ZATRANO rules (fail on findings)
        run: |
          semgrep scan \
            --config=framework/.github/semgrep/zatrano-rules.yml \
            --severity=ERROR \
            --error \
            --metrics=off \
            framework

  # Pin v-prefixed tag (post supply-chain recovery). Prefer SHA pin if tags move again.
  trivy:
    name: trivy-fs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout framework
        uses: actions/checkout@v5
        with:
          path: framework
      - name: Trivy FS (report all)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: framework
          scanners: vuln,secret,misconfig
          format: table
          exit-code: '0'
      - name: Trivy FS (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: framework
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    # Local longer runs: go test ./tests/fuzz/ -run=^$ -fuzz=FuzzX -fuzztime=30m
    strategy:
      fail-fast: false
      matrix:
        target:
          - FuzzRouterPath
          - FuzzDotenvParse
    defaults:
      run:
        working-directory: framework
    steps:
      - name: Checkout framework
        uses: actions/checkout@v5
        with:
          path: framework
      - name: Checkout canvas
        uses: actions/checkout@v5
        with:
          repository: zatrano/canvas
          ref: main
          path: canvas
      - name: Checkout rawhttp
        uses: actions/checkout@v5
        with:
          repository: zatrano/rawhttp
          ref: main
          path: rawhttp
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.13'
          cache: true
          cache-dependency-path: framework/go.mod
      - run: go mod download
      - name: Fuzz ${{ matrix.target }} (3m)
        run: bash .github/scripts/run-fuzz.sh ${{ matrix.target }} ./tests/fuzz/ 3m
      - name: Upload fuzz crash corpus
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: framework/tests/fuzz/testdata/fuzz/
          if-no-files-found: ignore

  summary:
    name: Security Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [vet, gosec, govulncheck, semgrep, trivy, fuzz]
    steps:
      - name: Write summary table
        run: |
          status() {
            case "$1" in
              success) echo PASS ;;
              failure) echo FAIL ;;
              cancelled) echo CANCELLED ;;
              skipped) echo SKIPPED ;;
              *) echo WARNING ;;
            esac
          }
          {
            echo "## Security Summary"
            echo ""
            echo "| Tool | Result |"
            echo "|------|--------|"
            echo "| go vet | $(status '${{ needs.vet.result }}') |"
            echo "| gosec | $(status '${{ needs.gosec.result }}') |"
            echo "| govulncheck | $(status '${{ needs.govulncheck.result }}') |"
            echo "| Semgrep | $(status '${{ needs.semgrep.result }}') |"
            echo "| Trivy FS | $(status '${{ needs.trivy.result }}') |"
            echo "| Fuzz | $(status '${{ needs.fuzz.result }}') |"
          } >> "$GITHUB_STEP_SUMMARY"
          for r in ${{ needs.vet.result }} ${{ needs.gosec.result }} ${{ needs.govulncheck.result }} ${{ needs.semgrep.result }} ${{ needs.trivy.result }} ${{ needs.fuzz.result }}; do
            if [ "$r" = "failure" ]; then
              exit 1
            fi
          done
