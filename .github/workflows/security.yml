name: security

on:
  push:
    branches: [main, '*.x']
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  vet:
    name: go-vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.13'
          cache: true
      - run: go mod download
      - run: go vet ./...

  race:
    name: go-test-race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.13'
          cache: true
      - run: go mod download
      # Full-tree race; skip optional nested modules (own go.mod / heavy CGO).
      - name: go test -race
        shell: bash
        run: |
          go test -race $(go list ./... | grep -vE '/packages/(database/driver|qr|mongo|webauthn)(/|$)') -count=1

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.13'
          cache: true
      - name: Read gosec excludes from .gosec.json
        id: gosec_cfg
        run: |
          EXCLUDES=$(jq -r '.exclude // [] | join(",")' .gosec.json)
          echo "exclude=$EXCLUDES" >> "$GITHUB_OUTPUT"
      - name: Run gosec
        uses: securego/gosec@master
        with:
          args: >
            -no-fail
            -fmt=sarif
            -out=gosec.sarif
            -conf=.gosec.json
            -exclude=${{ steps.gosec_cfg.outputs.exclude }}
            -exclude-dir=packages/database/driver
            -exclude-dir=packages/qr
            -exclude-dir=packages/mongo
            -exclude-dir=packages/webauthn
            -exclude-generated
            ./...
      - name: Upload gosec SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec.sarif
          category: gosec
      - name: gosec gate (fail on findings)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.2
          EXCLUDES=$(jq -r '.exclude // [] | join(",")' .gosec.json)
          gosec -quiet \
            -conf=.gosec.json \
            -exclude="$EXCLUDES" \
            -exclude-dir=packages/database/driver \
            -exclude-dir=packages/qr \
            -exclude-dir=packages/mongo \
            -exclude-dir=packages/webauthn \
            -exclude-generated \
            ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.13'
          cache: true
      - run: go mod download
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Run govulncheck
        shell: bash
        run: |
          set +e
          govulncheck ./... | tee govulncheck.txt
          code=${PIPESTATUS[0]}
          {
            echo "## govulncheck"
            echo ""
            echo '```'
            cat govulncheck.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

  # semgrep/semgrep-action is deprecated; use the official Semgrep image (recommended by Semgrep).
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan
        run: |
          semgrep scan \
            --config=p/golang \
            --config=p/security-audit \
            --config=security/semgrep/zatrano-rules.yml \
            --error \
            --metrics=off \
            .

  trivy:
    name: trivy-fs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Trivy FS (report all)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: table
          exit-code: '0'
      - name: Trivy FS (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    # Local longer runs: go test ./tests/fuzz/ -run=^$ -fuzz=FuzzX -fuzztime=30m
    strategy:
      fail-fast: false
      matrix:
        target:
          - FuzzRouterPath
          - FuzzRouterWherePattern
          - FuzzValidateMake
          - FuzzHTTPJSONBinding
          - FuzzSessionStart
          - FuzzCSRFMiddleware
          - FuzzQueryWhereToSQL
          - FuzzQueryWhereRaw
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.13'
          cache: true
      - run: go mod download
      - name: Fuzz ${{ matrix.target }} (3m)
        run: go test ./tests/fuzz/ -run=^$ -fuzz=${{ matrix.target }} -fuzztime=3m
      - name: Upload fuzz crash corpus
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: tests/fuzz/testdata/fuzz/
          if-no-files-found: ignore

  summary:
    name: Security Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [vet, race, gosec, govulncheck, semgrep, trivy, fuzz]
    steps:
      - name: Write summary table
        run: |
          status() {
            case "$1" in
              success) echo PASS ;;
              failure) echo FAIL ;;
              cancelled) echo CANCELLED ;;
              skipped) echo SKIPPED ;;
              *) echo WARNING ;;
            esac
          }
          {
            echo "## Security Summary"
            echo ""
            echo "| Tool | Result |"
            echo "|------|--------|"
            echo "| go vet | $(status '${{ needs.vet.result }}') |"
            echo "| go test -race | $(status '${{ needs.race.result }}') |"
            echo "| gosec | $(status '${{ needs.gosec.result }}') |"
            echo "| govulncheck | $(status '${{ needs.govulncheck.result }}') |"
            echo "| Semgrep | $(status '${{ needs.semgrep.result }}') |"
            echo "| Trivy FS | $(status '${{ needs.trivy.result }}') |"
            echo "| Fuzz | $(status '${{ needs.fuzz.result }}') |"
          } >> "$GITHUB_STEP_SUMMARY"
          for r in ${{ needs.vet.result }} ${{ needs.race.result }} ${{ needs.gosec.result }} ${{ needs.govulncheck.result }} ${{ needs.semgrep.result }} ${{ needs.trivy.result }} ${{ needs.fuzz.result }}; do
            if [ "$r" = "failure" ]; then
              exit 1
            fi
          done
