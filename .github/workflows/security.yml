name: security

on:
  push:
    branches: [main, '*.x']
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  fast:
    name: security-fast
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.13'
          cache: true
      - name: Download modules
        run: go mod download
      - name: go vet
        run: go vet ./...
      - name: Unit + security regression tests
        run: |
          go test ./packages/database/query/ ./packages/session/ ./packages/auth/ ./packages/middleware/... ./packages/http/ ./packages/routing/ ./packages/view/ ./packages/filesystem/ ./packages/safepath/ ./packages/websocket/ ./packages/trustedproxy/ ./packages/cookie/ -count=1
          go test -C packages/mongo -count=1
      - name: Fuzz smoke (identifiers)
        run: go test ./packages/database/query/ -run=^$ -fuzz=FuzzSanitizeIdentifier -fuzztime=15s

  race:
    name: race-detector
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.13'
          cache: true
      - run: go mod download
      - name: go test -race (security-sensitive)
        run: go test -race ./packages/session/ ./packages/auth/ ./packages/ratelimit/ ./packages/middleware/... -count=1

  static:
    name: gosec-govulncheck-staticcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.13'
          cache: true
      - run: go mod download
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          staticcheck ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.2
          # G301/G306: scaffold & public asset modes (0755/0644) are intentional DX defaults.
          # G505: SHA-1 required by WebSocket RFC 6455 and TOTP RFC 6238 (not for new password hashing).
          # G104: low-severity unhandled errors in non-security paths — tracked separately from critical scans.
          gosec -quiet -exclude=G301,G306,G505,G104 -exclude-generated ./...
