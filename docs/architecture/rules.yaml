# Architecture rules (machine catalog)
# Companion to docs/architecture/rules.md and zatrano doctor.

version: "1.0.0"
command: zatrano doctor
exit:
  pass: 0
  fail: 1
  warnings_fail_unless_strict: true

framework_tests:
  - id: FW-DEP-001
    name: Framework must not import packages
    severity: error
    method: TEST
    source: tests/architecture_test.go
  - id: FW-DEP-002
    name: Contracts must not import kernel
    severity: error
    method: TEST
    source: contracts/import_test.go
  - id: FW-DEP-003
    name: Contracts must not import packages
    severity: error
    method: TEST
    source: contracts/import_test.go

doctor:
  - id: APP-LAY-001
    name: Forbidden architectural directories
    severity: error
    method: FILESYSTEM
    check: layers
  - id: APP-LAY-002
    name: Forbidden package names
    severity: error
    method: AST
    check: layers
  - id: APP-LAY-003
    name: Forbidden layer types
    severity: error
    method: AST
    check: layers
  - id: APP-LAY-004
    name: Canonical directories present
    severity: warning
    method: FILESYSTEM
    check: layout
  - id: APP-LAY-005
    name: Legacy layout paths
    severity: error
    method: FILESYSTEM
    check: layout
  - id: APP-ROUTE-001
    name: Route declaration location
    severity: error
    method: AST
    check: routes
  - id: APP-ROUTE-002
    name: routing.From for REST verbs
    severity: error
    method: AST
    check: routes
  - id: APP-CON-001
    name: Contract concrete imports
    severity: warning
    method: AST
    check: concrete
  - id: APP-PROV-001
    name: Provider Register and Boot
    severity: warning
    method: AST
    check: providers
  - id: APP-CTL-001
    name: Controller package placement
    severity: error
    method: AST
    check: controllers
  - id: APP-CTL-002
    name: Controller HTTP signature
    severity: error
    method: AST
    check: controllers
  - id: APP-CTL-003
    name: No View+JSON mix in one method
    severity: error
    method: AST
    check: controllers
  - id: APP-CTL-004
    name: API controllers do not View
    severity: error
    method: AST
    check: controllers
  - id: APP-CTL-005
    name: Controllers do not own transactions
    severity: error
    method: AST
    check: controllers
  - id: APP-REQ-001
    name: FormRequest naming
    severity: error
    method: AST
    check: requests
  - id: APP-REQ-002
    name: No validation.Make in controllers
    severity: error
    method: AST
    check: requests
  - id: APP-REQ-003
    name: ValidateForm before persist
    severity: error
    method: AST
    check: requests
  - id: APP-ORM-001
    name: No string eager load
    severity: error
    method: AST
    check: orm
  - id: APP-VAL-001
    name: unique/exists need database
    severity: error
    method: AST
    check: validation
