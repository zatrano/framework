services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_URL: http://localhost:8080
    volumes:
      - ./storage:/app/storage
      - ./app/database:/app/app/database
    command: ["/app/app", "serve", "--port", "8080"]
